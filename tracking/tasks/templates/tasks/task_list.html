{% extends "base.html" %}

{% block content %}
    <h2>Завдання</h2>
    <a href="{% url 'task-create' %}" class="btn btn-create">Додати завдання</a>

    <ul>
        {% for task in tasks %}
        <li>
            <a href="{% url 'task-detail' task.pk %}">{{ task.title }}</a>
            {{ task.get_status_display }}
        </li>
        {% empty %}
        <li>Завдань немає</li>
        {% endfor %}
    </ul>
{% endblock %}
