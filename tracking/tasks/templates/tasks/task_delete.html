{% extends "base.html" %}
{% block content %}
    <h2>Видалити "{{ object.title }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">Видалити</button>
        <a href="{% url 'task-detail' object.pk %}" class="btn btn-back">Скасувати</a>
    </form>
{% endblock %}
